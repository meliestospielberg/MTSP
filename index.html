<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSP | The Renaissance Epoch</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HYXVVXR8V0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HYXVVXR8V0');
    </script>

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Classical Renaissance Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;600&display=swap');
        
        body {
            overflow-x: hidden;
            scroll-behavior: smooth;
            background-color: #fdfbf7;
            color: #1a1a1a;
        }

        /* Typography Classes */
        .font-renaissance { font-family: 'Cinzel', serif; }
        .font-classic { font-family: 'Cormorant Garamond', serif; }
        .font-sans { font-family: 'Inter', sans-serif; letter-spacing: 0.1em; }

        /* Renaissance Background Textures */
        .bg-fresco {
            background-color: #f7f5f0;
            background-image: 
                linear-gradient(90deg, rgba(212, 175, 55, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .bg-marble {
            background-color: #fdfbf7;
            background-image: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 60%);
        }

        /* Golden Frames and Embellishments */
        .renaissance-frame {
            border: 6px double #d4af37;
            padding: 12px;
            background: #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05), inset 0 0 0 1px rgba(212,175,55,0.3);
            position: relative;
        }
        
        .renaissance-frame::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            pointer-events: none;
        }

        .gold-accent { color: #d4af37; }
        .gold-border { border-color: #d4af37; }

        /* Elegant Section Dividers */
        .ornate-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 3rem 0;
            opacity: 0.7;
        }
        .ornate-divider::before, .ornate-divider::after {
            content: '';
            height: 1px;
            width: 60px;
            background: #d4af37;
            margin: 0 15px;
        }
        .ornate-diamond {
            width: 8px;
            height: 8px;
            background: #d4af37;
            transform: rotate(45deg);
        }

        /* Global image filter for classical painted look */
        .gallery-img {
            transition: all 0.7s ease;
            filter: contrast(1.05) saturate(0.9) sepia(0.1);
        }
        .gallery-img:hover {
            filter: contrast(1.1) saturate(1) sepia(0);
        }

        /* Monochromatic filter for specific portraits */
        .gallery-img-mono {
            transition: all 0.7s ease;
            filter: grayscale(100%) contrast(1.1) brightness(0.9) sepia(0.15);
        }
        .gallery-img-mono:hover {
            filter: grayscale(100%) contrast(1.2) brightness(1) sepia(0);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Component for Chapter Headings
        const ChapterHeading = ({ chapter, title }) => (
            <div className="text-center mb-16 relative z-20">
                <div className="font-sans text-[#d4af37] text-xs font-bold uppercase tracking-[0.2em] mb-4">
                    {chapter}
                </div>
                <h2 className="font-renaissance text-4xl md:text-5xl lg:text-6xl text-slate-900 tracking-wide">
                    {title}
                </h2>
                <div className="ornate-divider">
                    <div className="ornate-diamond"></div>
                </div>
            </div>
        );

        function App() {
            const [scrolled, setScrolled] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const toggleAudio = () => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.pause();
                        setIsPlaying(false);
                    } else {
                        audioRef.current.play().then(() => {
                            setIsPlaying(true);
                        }).catch(error => {
                            console.error("Audio playback failed:", error);
                        });
                    }
                }
            };

            return (
                <div className="min-h-screen relative z-10 antialiased">
                    
                    {/* Hidden Custom Audio Player */}
                    <audio 
                        ref={audioRef}
                        src="https://drive.google.com/uc?export=download&id=1FfCdvFIvCrMXkNDxisIi6eUl0liNdZSV"
                        loop
                    />

                    {/* Classical Navbar */}
                    <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? 'bg-white/95 backdrop-blur shadow-md py-4' : 'bg-transparent py-8'}`}>
                        <div className="max-w-7xl mx-auto px-8 flex justify-between items-center">
                            <div className="flex items-center">
                                {/* MTSP Logo instead of text */}
                                <img src="https://drive.google.com/thumbnail?id=1s4cCJKAPwQ5k0SruDN2W69dYbbYl__WR&sz=w500" alt="MTSP Logo" className="h-10 md:h-14 object-contain" />
                            </div>
                            <div className="flex items-center gap-8 text-xs font-sans tracking-[0.15em] text-slate-600 uppercase font-semibold">
                                <a href="#arrival" className="hover:text-[#d4af37] transition-colors hidden md:block">Valhalla</a>
                                <a href="#manifesto" className="hover:text-[#d4af37] transition-colors hidden md:block">Manifesto</a>
                                <a href="#latent" className="hover:text-[#d4af37] transition-colors hidden md:block">Latent</a>
                                <a href="#epics" className="hover:text-[#d4af37] transition-colors hidden lg:block">Epics</a>
                                <a href="#poetry" className="hover:text-[#d4af37] transition-colors hidden lg:block">Poetry</a>
                                <a href="#slate" className="hover:text-[#d4af37] transition-colors hidden lg:block">Frescoes</a>
                                <a href="#innovation" className="hover:text-[#d4af37] transition-colors hidden lg:block">Innovation</a>
                                <a href="#architects" className="hover:text-[#d4af37] transition-colors hidden md:block">Architects</a>
                                
                                {/* Audio Toggle Button */}
                                <button onClick={toggleAudio} className="flex items-center gap-2 border border-[#d4af37] px-4 py-2 text-[#d4af37] hover:bg-[#d4af37] hover:text-white transition-all ml-4">
                                    {isPlaying ? (
                                        <>
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                                            PAUSE
                                        </>
                                    ) : (
                                        <>
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                            PLAY TRACK
                                        </>
                                    )}
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* Landing Page / Header */}
                    <header className="relative pt-40 pb-20 px-4 md:px-8 max-w-7xl mx-auto min-h-screen flex flex-col justify-center items-center bg-fresco border-b border-[#d4af37]/20">
                        <div className="text-center w-full max-w-5xl relative z-10">
                            <h1 className="text-4xl md:text-5xl lg:text-7xl font-renaissance text-slate-900 leading-tight mb-8 drop-shadow-sm uppercase">
                                An Award Winning AI Studio
                            </h1>
                            <div className="border-l-4 gold-border pl-6 max-w-4xl mx-auto text-left mb-16">
                                <p className="font-classic text-xl md:text-3xl text-slate-800 leading-relaxed font-medium italic">
                                    "And not just any award — an award selected and curated by the real cosmonauts, as a sign of pioneering and harnessing the energy of AI and using it in the movie like what Tsiolkovsky did."
                                </p>
                            </div>
                            
                            <div className="w-full max-w-5xl mx-auto aspect-video relative mb-12 group cursor-pointer shadow-2xl">
                                <div className="renaissance-frame w-full h-full p-2">
                                    <a href="https://www.youtube.com/watch?v=A85em5CoKc4" target="_blank" rel="noreferrer" className="block relative w-full h-full overflow-hidden">
                                        <img src="https://img.youtube.com/vi/A85em5CoKc4/maxresdefault.jpg" alt="Emergence of Shiva" className="absolute inset-0 w-full h-full object-cover gallery-img group-hover:scale-105 transition-transform duration-700" />
                                        <div className="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors flex items-center justify-center">
                                            <div className="w-24 h-24 rounded-full border-2 border-[#d4af37] bg-white/90 flex items-center justify-center transform group-hover:scale-110 transition-transform shadow-[0_0_30px_rgba(212,175,55,0.4)]">
                                                <svg className="w-10 h-10 text-[#d4af37] ml-2" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                            </div>
                                        </div>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* CHAPTER I: Enter the Valhalla (Arrival) */}
                    <section id="arrival" className="bg-marble py-32 px-4 md:px-8 relative z-20">
                        <div className="max-w-6xl mx-auto">
                            <ChapterHeading chapter="Chapter I" title="Enter the Valhalla" />
                            
                            <div className="grid md:grid-cols-12 gap-12 items-center mt-12">
                                {/* Left: The Sublime Statement */}
                                <div className="md:col-span-5 font-classic italic text-3xl md:text-4xl leading-relaxed text-slate-700 border-l-4 gold-border pl-8 py-4">
                                    "MTSP — We have the power to go into the latent space and access whatever we want, using advanced LLM models and customized tools."
                                </div>
                                
                                {/* Right: The Proclamation */}
                                <div className="md:col-span-7 space-y-10">
                                    <h2 className="text-4xl md:text-5xl lg:text-6xl font-renaissance leading-tight text-slate-900">
                                        We can create what a team of <span className="italic gold-accent">10,000</span> cannot even imagine in their entire lifetimes.
                                    </h2>
                                    
                                    <div className="bg-white p-8 md:p-12 border border-[#d4af37]/30 shadow-xl relative">
                                        {/* Golden Corner Accents */}
                                        <div className="absolute top-0 left-0 w-6 h-6 border-t-2 border-l-2 gold-border"></div>
                                        <div className="absolute bottom-0 right-0 w-6 h-6 border-b-2 border-r-2 gold-border"></div>
                                        
                                        <p className="font-classic text-xl md:text-2xl leading-relaxed text-slate-800 font-medium">
                                            Because they are ignorant, stupid and duffer and they lack originality and they have no sense of Vedic philosophical concepts.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* CHAPTER II: Manifesto / MTSP */}
                    <section id="manifesto" className="bg-fresco py-32 px-4 md:px-8 relative z-20 border-y border-[#d4af37]/20">
                        <div className="max-w-6xl mx-auto">
                            <ChapterHeading chapter="Chapter II" title="Méliès to Spielberg Projects" />
                            
                            <div className="grid md:grid-cols-2 gap-12 items-center mb-16">
                                <div className="space-y-8">
                                    <p className="font-classic text-2xl md:text-3xl leading-relaxed text-slate-800">
                                        <span className="font-renaissance text-6xl mr-2 gold-accent float-left leading-none mt-2">E</span>xists to prove that the next Kubrick, the next Kurosawa, the next Nolan might be working from anywhere, with any budget, freed from institutional permission.
                                    </p>
                                    <p className="font-classic text-xl md:text-2xl leading-relaxed text-slate-700">
                                        We are the vanguard of cinema's democratization—where craft matters more than connections, vision outweighs venture capital, and storytelling transcends traditional gatekeeping.
                                    </p>
                                    <div className="border-l-4 gold-border pl-6 py-2">
                                        <p className="font-renaissance text-2xl md:text-3xl text-slate-900 leading-snug">
                                            The industry can adapt or become history. We're making history either way.
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="renaissance-frame p-2 bg-white shadow-xl">
                                    <a href="https://www.youtube.com/watch?v=e84smTQrNiU" target="_blank" rel="noreferrer" className="block relative aspect-video overflow-hidden border-2 border-[#d4af37]/30 group">
                                        <img 
                                            src="https://img.youtube.com/vi/e84smTQrNiU/maxresdefault.jpg" 
                                            alt="MTSP Cinematic Revolution" 
                                            className="absolute inset-0 w-full h-full object-cover gallery-img group-hover:scale-105 transition-transform duration-700"
                                        />
                                        <div className="absolute inset-0 bg-black/30 group-hover:bg-black/10 transition-colors flex items-center justify-center">
                                            <div className="w-20 h-20 rounded-full border-2 border-[#d4af37] bg-white/95 flex items-center justify-center transform group-hover:scale-110 transition-transform shadow-[0_0_30px_rgba(212,175,55,0.4)]">
                                                <svg className="w-8 h-8 text-[#d4af37] ml-2" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                            </div>
                                        </div>
                                    </a>
                                </div>
                            </div>
                            
                        </div>
                    </section>

                    {/* CHAPTER III: The Latent Universe */}
                    <section id="latent" className="bg-marble py-32 px-4 md:px-8 relative z-20">
                        <div className="max-w-6xl mx-auto">
                            <ChapterHeading chapter="Chapter III" title="The Latent Universe" />
                            
                            <div className="text-center mb-20 max-w-4xl mx-auto">
                                <h2 className="font-renaissance text-5xl md:text-7xl leading-tight text-slate-900 uppercase">
                                    We follow the<br/>
                                    <span className="gold-accent">Übermensch</span> principle.
                                </h2>
                            </div>

                            <div className="grid md:grid-cols-2 gap-12 mb-20">
                                <div className="text-center p-12 border border-[#d4af37]/30 bg-white shadow-md">
                                    <div className="font-renaissance text-5xl md:text-6xl gold-accent mb-4">25,000</div>
                                    <div className="font-sans text-slate-600 uppercase tracking-[0.2em] text-sm font-bold">Hours of AI Research.</div>
                                </div>
                                <div className="text-center p-12 border border-[#d4af37]/30 bg-white shadow-md">
                                    <div className="font-renaissance text-5xl md:text-6xl gold-accent mb-4">213</div>
                                    <div className="font-sans text-slate-600 uppercase tracking-[0.2em] text-sm font-bold">Distinct Prompt Variables.</div>
                                </div>
                            </div>

                            {/* The God Prompt - Massive Engraved Scale */}
                            <div className="renaissance-frame text-center p-16 md:p-24 max-w-4xl mx-auto my-16">
                                <h3 className="font-renaissance text-6xl md:text-8xl leading-none mb-8 text-slate-900">
                                    AND A<br/><span className="gold-accent text-7xl md:text-9xl">"GOD PROMPT"</span>
                                </h3>
                                <div className="ornate-divider mx-auto w-1/2">
                                    <div className="ornate-diamond"></div>
                                </div>
                                <p className="font-classic italic text-2xl md:text-3xl text-slate-700 font-medium">
                                    Without this all the 213 variables are redundant.
                                </p>
                            </div>

                            <div className="text-center mt-24">
                                <h4 className="font-renaissance text-4xl md:text-5xl text-slate-900 mb-6 uppercase tracking-wide">
                                    Approx. 11,000 Pages of Documentation.
                                </h4>
                                <div className="font-sans inline-block bg-slate-900 text-[#d4af37] px-8 py-3 text-xs font-bold uppercase tracking-[0.2em]">
                                    The research started on 18th October 2020.
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* CHAPTER IV: Cinematic Epics */}
                    <section id="epics" className="bg-fresco py-32 px-4 md:px-8 relative z-20 border-t border-[#d4af37]/20">
                        <div className="max-w-7xl mx-auto">
                            <ChapterHeading chapter="Chapter IV" title="Cinematic Epics" />
                            
                            <p className="font-classic italic text-center text-slate-600 text-2xl mb-20">Sacred Texts and Salvaged Artifacts of the Latent Age</p>
                            
                            {/* Vault of Major Artifacts */}
                            <div className="grid md:grid-cols-2 gap-12 max-w-5xl mx-auto">
                                <a href="https://www.youtube.com/watch?v=7ed-oBmh5_A" target="_blank" rel="noreferrer" className="block group">
                                    <div className="bg-white border border-[#d4af37]/30 shadow-lg p-6 h-full flex flex-col transition-transform duration-500 hover:-translate-y-2 hover:shadow-2xl">
                                        <div className="overflow-hidden mb-8 border-4 border-[#d4af37]/50 relative aspect-[4/3]">
                                            <img src="https://img.youtube.com/vi/7ed-oBmh5_A/maxresdefault.jpg" alt="Hayagriva - The Chant of Wisdom" className="w-full h-full object-cover gallery-img group-hover:scale-105"/>
                                        </div>
                                        <h3 className="text-3xl font-renaissance text-slate-900 mb-4 text-center group-hover:text-[#d4af37] transition-colors">Hayagriva - The Chant of Wisdom</h3>
                                        <p className="font-classic text-lg text-slate-600 text-center flex-grow">A profound visual and auditory exploration into the ancient depths of wisdom and cosmic sound.</p>
                                    </div>
                                </a>

                                <a href="https://www.youtube.com/watch?v=i_Y3vZHYeUA" target="_blank" rel="noreferrer" className="block group">
                                    <div className="bg-white border border-[#d4af37]/30 shadow-lg p-6 h-full flex flex-col transition-transform duration-500 hover:-translate-y-2 hover:shadow-2xl">
                                        <div className="overflow-hidden mb-8 border-4 border-[#d4af37]/50 relative aspect-[4/3]">
                                            <img src="https://img.youtube.com/vi/i_Y3vZHYeUA/maxresdefault.jpg" alt="Body: Dreams of E7" className="w-full h-full object-cover gallery-img group-hover:scale-105"/>
                                        </div>
                                        <h3 className="text-3xl font-renaissance text-slate-900 mb-4 text-center group-hover:text-[#d4af37] transition-colors">Body: Dreams of E7</h3>
                                        <p className="font-classic text-lg text-slate-600 text-center flex-grow">Masterclass in hybrid filmmaking. Virtual sets. Live actors. Seamless AI integration.</p>
                                    </div>
                                </a>

                                <a href="https://www.youtube.com/watch?v=AnWBpsinNuI" target="_blank" rel="noreferrer" className="block group">
                                    <div className="bg-white border border-[#d4af37]/30 shadow-lg p-6 h-full flex flex-col transition-transform duration-500 hover:-translate-y-2 hover:shadow-2xl">
                                        <div className="overflow-hidden mb-8 border-4 border-[#d4af37]/50 relative aspect-[4/3]">
                                            <img src="https://img.youtube.com/vi/AnWBpsinNuI/maxresdefault.jpg" alt="Moon Race 2082" className="w-full h-full object-cover gallery-img group-hover:scale-105"/>
                                        </div>
                                        <h3 className="text-3xl font-renaissance text-slate-900 mb-4 text-center group-hover:text-[#d4af37] transition-colors">Moon Race 2082</h3>
                                        <p className="font-classic text-lg text-slate-600 text-center flex-grow">A high-octane sci-fi vision of the future. Pushing the boundaries of generative world-building and cinematic pacing.</p>
                                    </div>
                                </a>

                                <a href="https://www.youtube.com/watch?v=FPiZuIprQIk" target="_blank" rel="noreferrer" className="block group">
                                    <div className="bg-white border border-[#d4af37]/30 shadow-lg p-6 h-full flex flex-col transition-transform duration-500 hover:-translate-y-2 hover:shadow-2xl">
                                        <div className="overflow-hidden mb-8 border-4 border-[#d4af37]/50 relative aspect-[4/3]">
                                            <img src="https://img.youtube.com/vi/FPiZuIprQIk/maxresdefault.jpg" alt="Anant-Rasa" className="w-full h-full object-cover gallery-img group-hover:scale-105"/>
                                        </div>
                                        <h3 className="text-3xl font-renaissance text-slate-900 mb-4 text-center group-hover:text-[#d4af37] transition-colors">Anant-Rasa</h3>
                                        <p className="font-classic text-lg text-slate-600 text-center flex-grow">A visceral exploration of eternal cosmic emotions, bending the latent space to manifest the infinite.</p>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* CHAPTER V: Music & Visual Poetry */}
                    <section id="poetry" className="bg-marble py-32 px-4 md:px-8 relative z-20 border-t border-[#d4af37]/20">
                        <div className="max-w-7xl mx-auto">
                            <ChapterHeading chapter="Chapter V" title="Music & Visual Poetry" />
                            
                            <div className="max-w-4xl mx-auto text-center mb-20 bg-white p-8 md:p-12 border border-[#d4af37]/30 shadow-md">
                                <p className="font-classic text-2xl md:text-3xl leading-relaxed text-slate-800">
                                    Original compositions scored using AI as an instrument—not as a replacement for musicianship, but as its most radical extension since the synthesiser.
                                </p>
                            </div>
                            
                            <div className="flex flex-wrap justify-center gap-6 max-w-5xl mx-auto">
                                {[
                                    { id: 'zl0hyRfZslY', title: 'ANGEL BORN IN HELL' },
                                    { id: 'wF9QzJbVHM0', title: 'SADASHIV ASHTAKAM' },
                                    { id: 'p-BIBkI-nDc', title: "STRANGER'S DREAM" },
                                    { id: 'j1QzBOXBQ9E', title: 'THAT GIRL FROM MY TOWN' },
                                    { id: 'SqBAJ-1cNeg', title: 'SHIV TANDAV (RAP)' },
                                    { id: 'Mx47a8T1D4c', title: 'DREAMS' },
                                    { id: 'xRX_5Q9BBCQ', title: 'ELENA AND THE CAFE' },
                                ].map((mv, index) => (
                                    <a key={mv.id} href={`https://www.youtube.com/watch?v=${mv.id}`} target="_blank" rel="noreferrer" className="block bg-white p-3 border border-[#d4af37]/30 shadow-sm hover:shadow-xl transition-all hover:-translate-y-1 group w-40 md:w-48">
                                        <div className="aspect-square relative overflow-hidden border-2 border-[#d4af37]/40 mb-3">
                                            <img 
                                                src={`https://img.youtube.com/vi/${mv.id}/maxresdefault.jpg`} 
                                                alt={mv.title} 
                                                onError={(e) => { e.target.src = `https://img.youtube.com/vi/${mv.id}/hqdefault.jpg`; }}
                                                className="absolute inset-0 w-full h-full object-cover gallery-img group-hover:scale-110 transition-transform duration-500"
                                            />
                                        </div>
                                        <h4 className="text-slate-800 font-sans text-[10px] font-bold leading-tight text-center uppercase tracking-widest">{mv.title}</h4>
                                    </a>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* CHAPTER VI: The Unwritten Frescoes */}
