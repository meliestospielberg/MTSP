<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSP | The Renaissance Epoch</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HYXVVXR8V0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HYXVVXR8V0');
    </script>

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Classical Renaissance Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;600&display=swap');
        
        body {
            overflow-x: hidden;
            scroll-behavior: smooth;
            background-color: #fdfbf7;
            color: #1a1a1a;
        }

        /* Typography Classes */
        .font-renaissance { font-family: 'Cinzel', serif; }
        .font-classic { font-family: 'Cormorant Garamond', serif; }
        .font-sans { font-family: 'Inter', sans-serif; letter-spacing: 0.1em; }

        /* Renaissance Background Textures */
        .bg-fresco {
            background-color: #f7f5f0;
            background-image: 
                linear-gradient(90deg, rgba(212, 175, 55, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .bg-marble {
            background-color: #fdfbf7;
            background-image: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 60%);
        }

        /* Golden Frames and Embellishments */
        .renaissance-frame {
            border: 6px double #d4af37;
            padding: 12px;
            background: #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05), inset 0 0 0 1px rgba(212,175,55,0.3);
            position: relative;
        }
        
        .renaissance-frame::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            pointer-events: none;
        }

        .gold-accent {
            color: #d4af37;
        }
        
        .gold-border {
            border-color: #d4af37;
        }

        /* Elegant Section Dividers */
        .ornate-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 3rem 0;
            opacity: 0.7;
        }
        .ornate-divider::before, .ornate-divider::after {
            content: '';
            height: 1px;
            width: 60px;
            background: #d4af37;
            margin: 0 15px;
        }
        .ornate-diamond {
            width: 8px;
            height: 8px;
            background: #d4af37;
            transform: rotate(45deg);
        }

        /* Global image filter for classical painted look */
        .gallery-img {
            transition: all 0.7s ease;
            filter: contrast(1.05) saturate(0.9) sepia(0.1);
        }
        .gallery-img:hover {
            filter: contrast(1.1) saturate(1) sepia(0);
        }

        /* Monochromatic filter for specific portraits */
        .gallery-img-mono {
            transition: all 0.7s ease;
            filter: grayscale(100%) contrast(1.1) brightness(0.9) sepia(0.15);
        }
        .gallery-img-mono:hover {
            filter: grayscale(100%) contrast(1.2) brightness(1) sepia(0);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATA FOR NOTHING SURVIVES SLIDER ---
        const slides = [
          {
            id: 1,
            kicker: "A Méliès to Spielberg Project",
            title: "NOTHING SURVIVES",
            subtitle: "The Complete History of the Universe",
            body: "A cinematic 6-part docu-series.",
            language: "English"
          },
          {
            id: 2,
            kicker: "Episode 1",
            title: "FROM NOTHING TO EVERYTHING",
            scripture: "नासदासीन्नो सदासीत्तदानीं\nनासीद्रजो नो व्योमा परो यत् ।\nकिमावरीवः कुह कस्य शर्मन्\nअम्भः किमासीद्गहनं गभीरम् ॥",
            language: "Sanskrit",
            dir: "ltr"
          },
          {
            id: 3,
            kicker: "Episode 2",
            title: "THE LONG WAIT",
            scripture: "בְּרֵאשִׁית בָּרָא אֱלֹהִים אֵת הַשָּׁמַיִם וְאֵת הָאָרֶץ׃\nוְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ וְחֹשֶׁךְ עַל־פְּנֵי תְהוֹם\nוְרוּחַ אֱלֹהִים מְרַחֶפֶת עַל־פְּנֵי הַמָּיִם׃",
            language: "Hebrew",
            dir: "rtl"
          },
          {
            id: 4,
            kicker: "Episode 3",
            title: "CONSCIOUSNESS AWAKENS",
            scripture: "Ante mare et terras et quod tegit omnia caelum,\nunus erat toto naturae vultus in orbe,\nquem dixere chaos: rudis indigestaque moles.",
            language: "Vulgar Latin",
            dir: "ltr"
          },
          {
            id: 5,
            kicker: "Episode 4",
            title: "THE TWILIGHT HOURS",
            scripture: "أَوَلَمْ يَرَ الَّذِينَ كَفَرُوا أَنَّ السَّمَاوَاتِ وَالْأَرْضَ\nكَانَتَا رَتْقًا فَفَتَقْنَاهُمَا",
            language: "Arabic",
            dir: "rtl"
          },
          {
            id: 6,
            kicker: "Episode 5",
            title: "THE GREAT SILENCE",
            scripture: "K'in xax k'u k'o wi ri k'ajk, xax k'u silanik,\nxax k'u lomanik, xax k'u tolonik ri uq'aj sutz',\nri uq'aj kaj.",
            language: "Mayan",
            dir: "ltr"
          },
          {
            id: 7,
            kicker: "Episode 6",
            title: "NOTHING SURVIVES",
            scripture: "𒂊𒉡𒈠𒂊𒇺𒆷𒈾𒁍𒌑𒊭𒈠𒈬\n𒊭𒀊𒇺𒄠𒈠𒌈𒋗𒈠𒆷𒍝ﻜﺮ𒀜\n𒍪𒀊𒈠𒊕ເທشون𒈬𒌝𒈬𒋾𒊩𒆳",
            language: "Sumerian",
            dir: "ltr"
          },
          {
            id: 8,
            kicker: "The Void",
            title: "", 
            scripture: "𐎣𐎵𖡄 𒈙ꙮ𑀲𑀳 𖤍𓆣𓇳\n𑣿𑰼𐡀 𐤈𐤄𐤀 𖢲𖡡𖨚\n𐫱𐫲𐫳 𑢠𑢡𑢢 𑚀𑚁𑚂",
            language: "Voynich-Paisachi",
            dir: "ltr",
            creator: "CREATOR - RISHI RAVINDER GOSWAMI",
            email: "rishi@meliestospielberg.in",
            studio: "MÉLIÈS TO SPIELBERG PROJECTS"
          }
        ];

        // --- SUBCOMPONENT: NOTHING SURVIVES SLIDER ---
        const NothingSurvivesSlider = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            const slideRef = useRef(null);
            const canvasRef = useRef(null);
            const [isPainting, setIsPainting] = useState(true);

            const nextSlide = () => setCurrentSlide((prev) => Math.min(prev + 1, slides.length - 1));
            const prevSlide = () => setCurrentSlide((prev) => Math.max(prev - 1, 0));

            useEffect(() => {
                const paintMasterpiece = () => {
                    const canvas = canvasRef.current;
                    const container = slideRef.current;
                    if (!canvas || !container) return;
                    
                    const width = container.clientWidth;
                    const height = container.clientHeight;
                    if (width === 0 || height === 0) return;

                    setIsPainting(true);
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d', { alpha: false });

                    let seed = currentSlide * 777 + 42;
                    const random = () => {
                        const x = Math.sin(seed++) * 10000;
                        return x - Math.floor(x);
                    };

                    const palettes = [
                        { fog: 'rgba(70, 80, 95,',   core: '#040608', stroke: 'rgba(120, 130, 150, 0.08)' }, // English
                        { fog: 'rgba(80, 50, 20,',   core: '#0a0502', stroke: 'rgba(255, 153, 51, 0.15)'  }, // Sanskrit
                        { fog: 'rgba(40, 65, 90,',   core: '#020408', stroke: 'rgba(0, 122, 165, 0.15)'   }, // Hebrew
                        { fog: 'rgba(70, 15, 45,',   core: '#060103', stroke: 'rgba(102, 2, 60, 0.18)'    }, // Latin
                        { fog: 'rgba(30, 70, 45,',   core: '#020503', stroke: 'rgba(0, 153, 51, 0.15)'    }, // Arabic
                        { fog: 'rgba(180, 100, 40,', core: '#0d0602', stroke: 'rgba(235, 140, 50, 0.15)'  }, // Mayan
                        { fog: 'rgba(42, 5, 5,',     core: '#050101', stroke: 'rgba(80, 15, 15, 0.12)'    }, // Sumerian
                        { fog: 'rgba(40, 40, 40,',   core: '#030303', stroke: 'rgba(80, 80, 80, 0.05)'   }  // Voynich
                    ];

                    const p = palettes[currentSlide];

                    const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
                    bgGrad.addColorStop(0, '#000000'); 
                    bgGrad.addColorStop(1, p.core);    
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, width, height);

                    ctx.globalCompositeOperation = 'screen';
                    for (let i = 0; i < 40; i++) {
                        const cx = random() * width;
                        const cy = (random() * random() * height) + (height * 0.3); 
                        const r = random() * (width * 0.8) + 50;
                        
                        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                        const opacity = random() * 0.04 + 0.01;
                        grad.addColorStop(0, `${p.fog} ${opacity})`);
                        grad.addColorStop(1, 'transparent');
                        
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(cx, cy, r, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.globalCompositeOperation = 'screen';
                    const strokeStartY = height * 0.45 + (random() - 0.5) * 80;
                    const strokeEndY = height * 0.55 + (random() - 0.5) * 80;
                    
                    for (let i = 0; i < 140; i++) {
                        ctx.beginPath();
                        const yOffset = (random() - 0.5) * 110; 
                        ctx.moveTo(-50, strokeStartY + yOffset);
                        
                        ctx.bezierCurveTo(
                            width * 0.3, strokeStartY + yOffset + (random() - 0.5) * 60,
                            width * 0.7, strokeEndY + yOffset + (random() - 0.5) * 60,
                            width + 50, strokeEndY + yOffset
                        );
                        
                        ctx.strokeStyle = p.stroke;
                        ctx.lineWidth = random() * 3 + 0.5;
                        ctx.stroke();
                    }

                    try {
                        ctx.globalCompositeOperation = 'overlay';
                        const imgData = ctx.getImageData(0, 0, width, height);
                        const data = imgData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            const grain = (random() - 0.5) * 16; 
                            data[i] = Math.max(0, Math.min(255, data[i] + grain));     
                            data[i+1] = Math.max(0, Math.min(255, data[i+1] + grain)); 
                            data[i+2] = Math.max(0, Math.min(255, data[i+2] + grain)); 
                        }
                        ctx.putImageData(imgData, 0, 0);
                    } catch (e) {
                        console.warn("Canvas texture grain skipped.");
                    }

                    setIsPainting(false);
                };

                paintMasterpiece();

                const resizeObserver = new ResizeObserver(() => paintMasterpiece());
                if (slideRef.current) resizeObserver.observe(slideRef.current);
                
                return () => {
                    if (slideRef.current) resizeObserver.unobserve(slideRef.current);
                }
            }, [currentSlide]);

            return (
                <div className="flex flex-col items-center justify-center p-4 font-sans select-none my-12">
                    
                    {/* The Exhibition Frame (4:5 Aspect Ratio) wrapped in Renaissance styling */}
                    <div className="relative flex items-center justify-center w-full max-w-5xl">
                        
                        <button
                            onClick={prevSlide}
                            disabled={currentSlide === 0}
                            className={`absolute left-0 md:left-10 z-20 p-4 text-[#d4af37] transition-all duration-300 ${
                                currentSlide === 0 ? 'opacity-20 cursor-not-allowed' : 'opacity-100 hover:scale-110 hover:text-white'
                            }`}
                        >
                            <svg className="w-10 h-10 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>

                        {/* Outer Renaissance Gold Frame */}
                        <div className="renaissance-frame p-2 bg-black shadow-2xl">
                            <div 
                                ref={slideRef}
                                className="relative w-full max-w-[420px] aspect-[4/5] bg-[#000000] overflow-hidden border border-[#d4af37]/30"
                            >
                                
                                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full z-0 block" />

                                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_0%,rgba(0,0,0,0.85)_100%)] z-10 pointer-events-none mix-blend-multiply" />
                                <div className="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/90 z-10 pointer-events-none" />

                                {/* Watermarks */}
                                <div className="absolute top-6 left-6 z-30 text-[9px] tracking-[0.3em] text-[#d4af37]/50 font-renaissance drop-shadow-md">
                                    M.T.S.P
                                </div>
                                <div className="absolute top-6 right-6 z-30 text-[9px] tracking-[0.2em] text-[#d4af37]/50 font-renaissance drop-shadow-md flex items-center gap-1">
                                    <span className="text-[10px]">&copy;</span> 2026
                                </div>

                                {/* Main Content */}
                                <div className="absolute inset-0 z-20 flex flex-col items-center justify-center px-10 pt-16 pb-20 pointer-events-none">
                                    
                                    {currentSlide === 0 ? (
                                        <div className="flex flex-col items-center w-full mt-10 pointer-events-auto">
                                            <p className="text-[9px] sm:text-[10px] tracking-[0.6em] uppercase mb-8 font-bold drop-shadow-[0_2px_6px_rgba(0,0,0,1)] text-[#d4af37] pointer-events-none font-sans">
                                                {slides[currentSlide].kicker}
                                            </p>
                                            
                                            <a 
                                                href="https://github.com/MTSProjects/Nothing-Survives" 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="font-renaissance text-white uppercase tracking-[0.2em] leading-tight drop-shadow-[0_4px_20px_rgba(0,0,0,1)] mb-8 text-3xl sm:text-4xl text-center cursor-pointer transition-all duration-700 hover:text-[#d4af37] hover:scale-105 block pointer-events-auto"
                                            >
                                                {slides[currentSlide].title}
                                            </a>

                                            <p className="text-xs sm:text-sm text-[#e2e8f0] font-light tracking-[0.3em] uppercase mb-8 opacity-90 border-t border-b border-[#d4af37]/30 py-5 px-4 w-full drop-shadow-[0_2px_8px_rgba(0,0,0,1)] text-center pointer-events-none font-sans">
                                                {slides[currentSlide].subtitle}
                                            </p>
                                            <p className="text-xs sm:text-sm text-[#cbd5e1] font-classic italic max-w-[280px] leading-relaxed drop-shadow-[0_2px_8px_rgba(0,0,0,1)] text-center pointer-events-none">
                                                "{slides[currentSlide].body}"
                                            </p>
                                        </div>

                                    ) : currentSlide === slides.length - 1 ? (
                                        <div className="flex flex-col items-center w-full h-full pt-16">
                                            <p className="text-[9px] sm:text-[10px] tracking-[0.6em] uppercase mb-10 font-bold drop-shadow-[0_2px_6px_rgba(0,0,0,1)] text-[#d4af37] font-sans">
                                                {slides[currentSlide].kicker}
                                            </p>
                                            
                                            <div className="mb-10 w-full flex flex-col items-center pointer-events-none" dir={slides[currentSlide].dir}>
                                                {slides[currentSlide].scripture.split('\n').map((line, idx) => (
                                                    <p key={idx} className="text-sm sm:text-base text-white font-classic leading-[2.2] drop-shadow-[0_4px_12px_rgba(0,0,0,1)] text-center w-full opacity-90 my-1 tracking-widest">
                                                        {line}
                                                    </p>
                                                ))}
                                            </div>

                                            <p className="mt-4 text-[9px] sm:text-[10px] tracking-[0.4em] text-[#d4af37]/50 uppercase drop-shadow-md pointer-events-none font-sans">
                                                [ {slides[currentSlide].language} ]
                                            </p>
                                            
                                            <div className="mt-auto flex flex-col items-center w-full pointer-events-none">
                                                <div className="w-12 h-[1px] bg-[#d4af37]/50 mb-6" />
                                                <p className="text-[9px] sm:text-[10px] text-white tracking-[0.25em] uppercase mb-2 opacity-90 font-renaissance drop-shadow-sm">
                                                    {slides[currentSlide].creator}
                                                </p>
                                                <p className="text-[9px] sm:text-[10px] text-[#d4af37] tracking-[0.15em] lowercase mb-4 opacity-90 drop-shadow-sm font-sans">
                                                    {slides[currentSlide].email}
                                                </p>
                                                <p className="text-[8px] sm:text-[9px] text-white/70 tracking-[0.4em] uppercase opacity-70 font-sans font-medium drop-shadow-sm">
                                                    {slides[currentSlide].studio}
                                                </p>
                                            </div>
                                        </div>

                                    ) : (
                                        <div className="flex flex-col items-center w-full h-full justify-center pointer-events-auto">
                                            
                                            <div className="flex flex-col items-center mb-8">
                                                <p className="text-[9px] sm:text-[10px] tracking-[0.6em] uppercase mb-4 font-bold drop-shadow-[0_2px_6px_rgba(0,0,0,1)] text-[#d4af37] pointer-events-none font-sans">
                                                    {slides[currentSlide].kicker}
                                                </p>
                                                
                                                <a 
                                                    href="https://github.com/MTSProjects/Nothing-Survives" 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="font-renaissance text-white/95 uppercase tracking-[0.25em] leading-tight drop-shadow-lg text-base sm:text-lg text-center max-w-[280px] cursor-pointer transition-all duration-700 hover:text-[#d4af37] hover:scale-110 block pointer-events-auto"
                                                >
                                                    {slides[currentSlide].title}
                                                </a>
                                            </div>
                                            
                                            <div className="flex flex-col items-center justify-center w-full pointer-events-none" dir={slides[currentSlide].dir}>
                                                {slides[currentSlide].scripture.split('\n').map((line, idx) => (
                                                    <p key={idx} className="text-[10px] sm:text-xs text-white font-classic tracking-[0.25em] leading-[2.8] drop-shadow-md text-center w-full my-1 opacity-95">
                                                        {line}
                                                    </p>
                                                ))}
                                            </div>

                                            <p className="mt-8 text-[9px] sm:text-[10px] tracking-[0.4em] text-[#d4af37]/50 uppercase drop-shadow-md pointer-events-none font-sans">
                                                [ {slides[currentSlide].language} ]
                                            </p>

                                        </div>
                                    )}

                                </div>

                                {/* Navigation Dots */}
                                <div className="absolute bottom-6 left-0 right-0 flex justify-center space-x-2 z-20 pointer-events-none">
                                    {slides.map((_, i) => (
                                        <div
                                            key={i}
                                            className={`transition-all duration-500 ${
                                                currentSlide === i 
                                                    ? 'w-4 h-[2px] bg-[#d4af37] shadow-[0_0_8px_rgba(212,175,55,0.4)]'
                                                    : 'w-1 h-[2px] bg-white/20'
                                            }`}
                                        />
                                    ))}
                                </div>
                            </div>
                        </div>

                        <button
                            onClick={nextSlide}
                            disabled={currentSlide === slides.length - 1}
                            className={`absolute right-0 md:right-10 z-20 p-4 text-[#d4af37] transition-all duration-300 ${
                                currentSlide === slides.length - 1 ? 'opacity-20 cursor-not-allowed' : 'opacity-100 hover:scale-110 hover:text-white'
                            }`}
                        >
                            <svg className="w-10 h-10 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 5l7 7-7 7" />
                            </svg>
                        </button>

                    </div>

                    <p className="text-slate-500 text-[10px] mt-8 tracking-widest uppercase font-sans text-center font-bold">
                        Slide {currentSlide + 1} of {slides.length} — {slides[currentSlide].language}
                    </p>
                </div>
            );
        };

        // Custom Component for Chapter Headings
        const ChapterHeading = ({ chapter, title }) => (
            <div className="text-center mb-16 relative z-20">
                <div className="font-sans text-[#d4af37] text-xs font-bold uppercase tracking-[0.2em] mb-4">
                    {chapter}
                </div>
                <h2 className="font-renaissance text-4xl md:text-5xl lg:text-6xl text-slate-900 tracking-wide">
                    {title}
                </h2>
                <div className="ornate-divider">
                    <div className="ornate-diamond"></div>
                </div>
            </div>
        );

        function App() {
            const [scrolled, setScrolled] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const toggleAudio = () => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.pause();
                        setIsPlaying(false);
                    } else {
                        audioRef.current.play().then(() => {
                            setIsPlaying(true);
                        }).catch(error => {
                            console.error("Audio playback failed:", error);
                        });
                    }
                }
            };

            return (
                <div className="min-h-screen relative z-10 antialiased">
                    
                    {/* Hidden Custom Audio Player */}
                    <audio 
                        ref={audioRef}
                        src="https://drive.google.com/uc?export=download&id=1FfCdvFIvCrMXkNDxisIi6eUl0liNdZSV"
                        loop
                    />

                    {/* Classical Navbar */}
                    <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? 'bg-white/95 backdrop-blur shadow-md py-4' : 'bg-transparent py-8'}`}>
