<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSP | The Renaissance Epoch</title>
   
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
   
    <!-- Stable UMD Builds for React and ReactDOM -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
   
    <!-- Babel Standalone for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js" crossorigin></script>
   
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;600&display=swap');
       
        :root {
            scroll-padding-top: 5rem;
        }

        body {
            overflow-x: hidden;
            background-color: #fdfbf7;
            color: #1a1a1a;
        }
       
        /* Typography */
        .font-renaissance { font-family: 'Cinzel', serif; }
        .font-classic { font-family: 'Cormorant Garamond', serif; }
        .font-sans { font-family: 'Inter', sans-serif; letter-spacing: 0.1em; }

        /* Background Textures */
        .bg-fresco {
            background-color: #f7f5f0;
            background-image: linear-gradient(90deg, rgba(212, 175, 55, 0.05) 1px, transparent 1px),
                              linear-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .bg-marble {
            background-color: #fdfbf7;
            background-image: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 60%);
        }

        /* Ornate Elements */
        .renaissance-frame {
            border: 6px double #d4af37;
            padding: 12px;
            background: #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05), inset 0 0 0 1px rgba(212,175,55,0.3);
            position: relative;
        }
        .renaissance-frame::before {
            content: '';
            position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            pointer-events: none;
        }

        .gold-accent { color: #d4af37; }
        .gold-border { border-color: #d4af37; }

        .ornate-divider {
            display: flex; align-items: center; justify-content: center;
            margin: 3rem 0; opacity: 0.7;
        }
        .ornate-divider::before, .ornate-divider::after {
            content: ''; height: 1px; width: 60px; background: #d4af37; margin: 0 15px;
        }
        .ornate-diamond {
            width: 8px; height: 8px; background: #d4af37; transform: rotate(45deg);
        }

        /* Image Filters */
        .gallery-img {
            transition: all 0.7s ease;
            filter: contrast(1.05) saturate(0.9) sepia(0.1);
        }
        .gallery-img:hover {
            filter: contrast(1.1) saturate(1) sepia(0);
        }
       
        .gallery-img-mono {
            transition: all 0.7s ease;
            filter: grayscale(100%) contrast(1.1) brightness(0.9) sepia(0.15);
        }
        .gallery-img-mono:hover {
            filter: grayscale(100%) contrast(1.2) brightness(1) sepia(0);
        }

        /* Scroll Animation Classes */
        .fade-section {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .fade-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Component to handle cinematic scroll-reveal animations
        const FadeInSection = ({ children, delay = 0 }) => {
            const [isVisible, setVisible] = useState(false);
            const domRef = useRef();

            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setTimeout(() => setVisible(true), delay);
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.15, rootMargin: "0px 0px -50px 0px" });
               
                if (domRef.current) {
                    observer.observe(domRef.current);
                }
                return () => observer.disconnect();
            }, [delay]);

            return (
                <div ref={domRef} className={`fade-section ${isVisible ? 'is-visible' : ''}`}>
                    {children}
                </div>
            );
        };

        const ChapterHeading = ({ chapter, title }) => (
            <FadeInSection>
                <div className="text-center mb-16 relative z-20">
                    <div className="font-sans text-[#d4af37] text-xs font-bold uppercase tracking-[0.2em] mb-4">{chapter}</div>
                    <h2 className="font-renaissance text-4xl md:text-5xl lg:text-6xl text-slate-900 tracking-wide">{title}</h2>
                    <div className="ornate-divider"><div className="ornate-diamond"></div></div>
                </div>
            </FadeInSection>
        );

        const Navigation = ({ scrolled, toggleAudio, isPlaying, playbackError }) => (
            <nav className={`fixed w-full z-50 transition-all duration-700 ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-md py-4' : 'bg-transparent py-8'}`}>
                <div className="max-w-7xl mx-auto px-8 flex justify-between items-center">
                    <div className="font-renaissance font-bold tracking-[0.15em] text-xl text-slate-900">
                        M<span className="gold-accent">T</span>SP
                    </div>
                    <div className="flex items-center gap-6 lg:gap-8 text-xs font-sans tracking-[0.15em] text-slate-600 uppercase font-semibold">
                        <a href="#arrival" className="hover:text-[#d4af37] transition-colors hidden md:block">Valhalla</a>
                        <a href="#manifesto" className="hover:text-[#d4af37] transition-colors hidden md:block">Manifesto</a>
                        <a href="#latent" className="hover:text-[#d4af37] transition-colors hidden lg:block">Latent</a>
                        <a href="#epics" className="hover:text-[#d4af37] transition-colors hidden lg:block">Epics</a>
                        <a href="#poetry" className="hover:text-[#d4af37] transition-colors hidden xl:block">Poetry</a>
                        <a href="#architects" className="hover:text-[#d4af37] transition-colors hidden md:block">Architects</a>
                        <div className="relative">
                            <button
                                onClick={toggleAudio}
                                className={`border px-4 py-2 transition-all duration-300 ${isPlaying ? 'bg-[#d4af37] text-white border-[#d4af37] shadow-[0_0_15px_rgba(212,175,55,0.4)]' : 'border-[#d4af37] hover:bg-[#d4af37] hover:text-white'}`}
                            >
                                {isPlaying ? "PAUSE TRACK" : "PLAY TRACK"}
                            </button>
                            {playbackError && (
                                <span className="absolute top-full left-0 mt-2 text-[10px] text-red-500 whitespace-nowrap">
                                    Please interact with the page first.
                                </span>
                            )}
                        </div>
                    </div>
                </div>
            </nav>
        );

        const Hero = () => (
            <header className="relative pt-32 pb-20 px-4 md:px-8 max-w-7xl mx-auto min-h-screen flex flex-col justify-center items-center bg-fresco border-b border-[#d4af37]/20">
                <FadeInSection>
                    <div className="text-center w-full max-w-5xl relative z-10">
                        <div className="mb-12 max-w-3xl mx-auto">
                            <h3 className="font-sans tracking-[0.3em] text-[#d4af37] text-xs md:text-sm mb-4 uppercase font-bold">7th Tsiolkovsky Space Fest (Russia)</h3>
                            <p className="font-classic italic text-lg md:text-xl text-slate-700 leading-relaxed px-4">
                                Winner of Special Award for Emergence of Shiva. Hand-selected by actual cosmonauts. They awarded us when they saw how we have blended Vedic philosophy and science with future technology—a prime example of Vedic-futurism.
                            </p>
                        </div>
                        <h1 className="text-6xl md:text-8xl lg:text-9xl font-renaissance text-slate-900 leading-none mb-6">MÉLIÈS</h1>
                       
                        <div className="flex items-center justify-center gap-6 my-8">
                            <div className="h-px w-24 bg-gradient-to-r from-transparent to-[#d4af37]"></div>
                            <span className="font-classic italic text-3xl text-slate-500">to</span>
                            <div className="h-px w-24 bg-gradient-to-l from-transparent to-[#d4af37]"></div>
                        </div>
                       
                        <div className="w-full max-w-4xl mx-auto aspect-[21/9] relative mb-12 transform hover:scale-[1.02] transition-transform duration-700">
                            <div className="renaissance-frame w-full h-full">
                                <div className="w-full h-full relative overflow-hidden bg-black/5">
                                    <img
                                        src="https://drive.google.com/thumbnail?id=1s4cCJKAPwQ5k0SruDN2W69dYbbYl__WR&sz=w1500"
                                        alt="MTSP Center Art"
                                        className="absolute inset-0 w-full h-full object-cover gallery-img"
                                    />
                                </div>
                            </div>
                        </div>
                       
                        <h1 className="text-6xl md:text-8xl lg:text-9xl font-renaissance text-slate-900 leading-none">SPIELBERG</h1>
                        <div className="mt-16 font-sans tracking-[0.3em] text-xs text-slate-500 uppercase border-y border-[#d4af37]/40 py-4 inline-block px-16 font-bold">
                            Projects
                        </div>
                    </div>
                </FadeInSection>
            </header>
        );

        const ChapterArrival = () => (
            <section id="arrival" className="bg-marble py-32 px-4 md:px-8 relative z-20">
                <div className="max-w-6xl mx-auto">
                    <ChapterHeading chapter="Chapter I" title="Enter the Valhalla" />
                    <FadeInSection delay={200}>
                        <div className="grid md:grid-cols-12 gap-12 items-center mt-12">
                            <div className="md:col-span-5 font-classic italic text-3xl md:text-4xl leading-relaxed text-slate-700 border-l-4 gold-border pl-8 py-4">
                                "MTSP — We have the power to go into the latent space and access whatever we want, using advanced LLM models and customized tools."
                            </div>
                            <div className="md:col-span-7 space-y-10">
                                <h2 className="text-3xl md:text-4xl lg:text-5xl font-renaissance leading-tight text-slate-900">
                                    We create content that inspires people to look beyond their intellect and connect with their deepest emotions. By speaking to their true selves, they are no longer just an audience, but literal admirers of our work.
                                </h2>
                                <div className="bg-white p-8 md:p-12 border border-[#d4af37]/30 shadow-xl relative hover:shadow-2xl transition-shadow duration-500">
                                    <div className="absolute top-0 left-0 w-6 h-6 border-t-2 border-l-2 gold-border"></div>
                                    <div className="absolute bottom-0 right-0 w-6 h-6 border-b-2 border-r-2 gold-border"></div>
                                    <p className="font-classic text-xl md:text-2xl leading-relaxed text-slate-800 font-medium">
                                        Because they are ignorant, stupid and duffer and they lack originality and they have no sense of Vedic philosophical concepts.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </FadeInSection>
                </div>
            </section>
        );

        const ChapterManifesto = () => (
            <section id="manifesto" className="bg-fresco py-32 px-4 md:px-8 relative z-20 border-y border-[#d4af37]/20">
                <div className="max-w-6xl mx-auto">
                    <ChapterHeading chapter="Chapter II" title="Méliès to Spielberg Projects" />
                   
                    <div className="grid md:grid-cols-2 gap-12 items-center mb-16">
                        <FadeInSection>
                            <div className="space-y-8">
                                <p className="font-classic text-2xl md:text-3xl leading-relaxed text-slate-800">
                                    <span className="font-renaissance text-6xl mr-2 gold-accent float-left leading-none mt-2">E</span>
                                    xists to prove that the next Kubrick, the next Kurosawa, the next Nolan might be working from anywhere, with any budget, freed from institutional permission.
                                </p>
                                <p className="font-classic text-xl md:text-2xl leading-relaxed text-slate-700">
                                    We are the vanguard of cinema's democratization—where craft matters more than connections, vision outweighs venture capital, and storytelling transcends traditional gatekeeping.
                                </p>
                                <div className="border-l-4 gold-border pl-6 py-2">
                                    <p className="font-classic text-2xl md:text-3xl text-slate-900 leading-snug italic">
                                        Before you explore the infinite bounds of our internal universe, we invite you to witness the tapestries we've woven for visionaries who have already seen the potential in our craft and partnered with us.
                                    </p>
                                </div>
                            </div>
                        </FadeInSection>
                       
                        <FadeInSection delay={200}>
                            <div className="renaissance-frame p-2 bg-white shadow-xl">
                                <a href="https://www.youtube.com/watch?v=e84smTQrNiU" target="_blank" rel="noreferrer" className="block relative aspect-video overflow-hidden border-2 border-[#d4af37]/30 group">
                                    <img
                                        src="https://img.youtube.com/vi/e84smTQrNiU/maxresdefault.jpg"
                                        alt="MTSP Cinematic Revolution"
                                        className="absolute inset-0 w-full h-full object-cover gallery-img group-hover:scale-105"
                                        onError={(e) => { e.target.src = "https://img.youtube.com/vi/e84smTQrNiU/hqdefault.jpg"; }}
                                    />
                                    <div className="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors duration-500 flex items-center justify-center">
                                        <div className="w-16 h-16 rounded-full border-2 border-white/80 flex items-center justify-center bg-black/40 backdrop-blur-sm group-hover:scale-110 transition-transform">
                                            <div className="w-0 h-0 border-y-8 border-y-transparent border-l-[14px] border-l-white ml-1"></div>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </FadeInSection>
                    </div>
                   
                    <FadeInSection delay={300}>
                        <div className="my-24 group">
                            <div className="text-center mb-12">
                                <h2 className="font-sans text-[#d4af37] text-sm uppercase tracking-[0.3em] font-bold mb-4">Collaborative Endeavors</h2>
                                <h3 className="font-renaissance text-4xl md:text-5xl text-slate-900">Visionaries Who Partnered With Us</h3>
                            </div>
                           
                            <a href="https://drive.google.com/drive/folders/1-ytP_VrcOi23wA8I8SRhadp6jCgL1bTl?usp=sharing" target="_blank" rel="noreferrer" className="block relative w-full max-w-5xl mx-auto aspect-[21/9] md:aspect-[2.5/1] overflow-hidden renaissance-frame bg-slate-900 p-2 shadow-2xl hover:shadow-[#d4af37]/20 transition-all duration-700">
                                <img
                                    src="https://drive.google.com/thumbnail?id=16yc5Mfr3LTlvvPk1c7nLjjlTYCTQRVm8&sz=w1500"
                                    alt="Collaborative Visionaries"
                                    className="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105 opacity-80 group-hover:opacity-100"
                                />
                                <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-8 md:p-12">
                                    <div className="relative z-10 flex flex-col items-center md:items-start text-center md:text-left transform translate-y-4 group-hover:translate-y-0 transition-transform duration-500">
                                        <div className="w-16 h-16 rounded-full border-2 border-[#d4af37]/80 flex items-center justify-center bg-black/40 backdrop-blur-sm group-hover:bg-[#d4af37] group-hover:border-transparent transition-all duration-500 mb-6 mx-auto md:mx-0 shadow-[0_0_15px_rgba(212,175,55,0.4)]">
                                            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                                        </div>
                                        <div className="flex items-center justify-center md:justify-start gap-4 opacity-80 group-hover:opacity-100 transition-opacity duration-700">
                                            <span className="font-sans text-xs text-[#d4af37] group-hover:text-white tracking-[0.2em] uppercase font-bold transition-colors">Click To See Our Client Work</span>
                                            <div className="w-12 h-px bg-[#d4af37] group-hover:bg-white transition-colors"></div>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </FadeInSection>
                </div>
            </section>
        );

        const ChapterLatent = () => (
            <section id="latent" className="bg-marble py-32 px-4 md:px-8 relative z-20">
                <div className="max-w-6xl mx-auto">
                    <ChapterHeading chapter="Chapter III" title="The Latent Universe" />
                   
                    <FadeInSection>
                        <div className="text-center mb-20 max-w-4xl mx-auto">
                            <h2 className="font-renaissance text-4xl md:text-6xl lg:text-7xl leading-tight text-slate-900 uppercase">
                                We follow the<br/><span className="gold-accent">Übermensch</span> principle.
                            </h2>
                        </div>
                    </FadeInSection>
                   
                    <div className="flex justify-center mb-20">
                        <FadeInSection delay={100}>
                            <div className="text-center p-12 border border-[#d4af37]/30 bg-white shadow-md hover:-translate-y-2 transition-transform duration-500 px-16 md:px-24">
                                <div className="font-renaissance text-5xl md:text-6xl gold-accent mb-4">25,000</div>
                                <div className="font-sans text-slate-600 uppercase tracking-[0.2em] text-sm font-bold">Hours of AI Research.</div>
                            </div>
                        </FadeInSection>
                    </div>
                   
                    <FadeInSection delay={300}>
                        <div className="renaissance-frame text-center p-12 md:p-20 max-w-4xl mx-auto my-16">
                            <p className="font-classic text-2xl md:text-3xl text-slate-800 leading-relaxed font-medium">
                                After years of relentless research and heavy R&D, we have hit a milestone we are incredibly proud to share. Through continuous iteration, we have created a master prompt—transforming a once-cluttered structure of many variables into one simple, seamless architecture. It is now a single, elegant prompt capable of molding itself to fit any scene or scenario flawlessly.
                            </p>
                        </div>
                    </FadeInSection>
                   
                    <FadeInSection delay={400}>
                        <div className="text-center mt-24">
                            <h4 className="font-renaissance text-3xl md:text-5xl text-slate-900 mb-6 uppercase tracking-wide">Approx. 11,000 Pages of Documentation.</h4>
                            <div className="font-sans inline-block bg-slate-900 text-[#d4af37] px-8 py-3 text-xs font-bold uppercase tracking-[0.2em] shadow-lg">
                                The research started on 18th October 2020.
                            </div>
                        </div>
                    </FadeInSection>
                </div>
            </section>
        );

        const ChapterEpics = () => {
            const epics = [
                {
                    id: "A85em5CoKc4",
                    title: "Emergence of Shiva",
                    desc: "A 19-minute epic space opera crafted entirely solo by Rishi Ravinder Goswami. Witness the gods in a never-before-seen avatar—speaking fluent Sanskrit, Prakrit, Hebrew, Mayan, and Sumerian, while the rest of the world still struggles to make AI speak basic English."
                },
                {
                    id: "1U7rMj1XvoCHhI1Pn11tN5ShiUjsBPXLj",
                    isDrive: true,
                    title: "Body: Dreams of E7",
                    desc: "Weaving the Zhuangzi butterfly parable into the story of a girl seeking her realities, showcased with true AI. The profound and powerful visual aesthetics evoke a dreamscape painted on a fantastic canvas."
                },
                {
                    id: "AnWBpsinNuI",
                    title: "Moon Race 2082",
                    desc: "A high-octane sci-fi vision of the future. Pushing the boundaries of generative world-building and cinematic pacing."
                },
                {
                    id: "FPiZuIprQIk",
                    title: "Anant-Rasa",
                    desc: "A visceral exploration of eternal cosmic emotions, bending the latent space to manifest the infinite."
                }
            ];

            return (
                <section id="epics" className="bg-fresco py-32 px-4 md:px-8 relative z-20 border-t border-[#d4af37]/20">
                    <div className="max-w-7xl mx-auto">
                        <ChapterHeading chapter="Chapter IV" title="Cinematic Epics" />
                        <FadeInSection>
                            <p className="font-classic italic text-center text-slate-600 text-2xl mb-20">Sacred Texts and Salvaged Artifacts of the Latent Age</p>
                        </FadeInSection>
                       
                        <div className="grid md:grid-cols-2 gap-12 max-w-5xl mx-auto">
                            {epics.map((epic, idx) => (
                                <FadeInSection key={idx} delay={idx * 150}>
                                    <a href={epic.isDrive ? "https://www.youtube.com/watch?v=i_Y3vZHYeUA" : `https://www.youtube.com/watch?v=${epic.id}`} target="_blank" rel="noreferrer" className="block group h-full">
                                        <div className="bg-white border border-[#d4af37]/30 shadow-lg p-6 h-full flex flex-col transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl">
                                            <div className="overflow-hidden mb-8 border-4 border-[#d4af37]/50 relative aspect-[4/3] bg-black/5">
                                                <img
                                                    src={epic.isDrive ? `https://drive.google.com/thumbnail?id=${epic.id}&sz=w1000` : `https://img.youtube.com/vi/${epic.id}/maxresdefault.jpg`}
                                                    alt={epic.title}
                                                    className="w-full h-full object-cover gallery-img group-hover:scale-105"
                                                    onError={(e) => {
                                                        if(!epic.isDrive) e.target.src = `https://img.youtube.com/vi/${epic.id}/hqdefault.jpg`;
                                                    }}
                                                />
                                                <div className="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-colors duration-500 flex items-center justify-center opacity-0 group-hover:opacity-100">
                                                    <div className="w-12 h-12 rounded-full bg-[#d4af37]/90 text-white flex items-center justify-center shadow-lg">
                                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                                    </div>
                                                </div>
                                            </div>
                                            <h3 className="text-3xl font-renaissance text-slate-900 mb-4 text-center group-hover:text-[#d4af37] transition-colors">{epic.title}</h3>
                                            <p className="font-classic text-lg text-slate-600 text-center flex-grow">{epic.desc}</p>
                                        </div>
                                    </a>
                                </FadeInSection>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const ChapterPoetry = () => {
            const tracks = [
                { id: 'zl0hyRfZslY', title: 'ANGEL BORN IN HELL' },
                { id: 'wF9QzJbVHM0', title: 'SADASHIV ASHTAKAM' },
                { id: 'p-BIBkI-nDc', title: "STRANGER'S DREAM" },
                { id: 'j1QzBOXBQ9E', title: 'THAT GIRL FROM MY TOWN' },
                { id: 'SqBAJ-1cNeg', title: 'SHIV TANDAV (RAP)' },
                { id: 'Mx47a8T1D4c', title: 'DREAMS' },
                { id: 'xRX_5Q9BBCQ', title: 'ELENA AND THE CAFE' },
            ];

            return (
                <section id="poetry" className="bg-marble py-32 px-4 md:px-8 relative z-20 border-t border-[#d4af37]/20">
                    <div className="max-w-7xl mx-auto">
                        <ChapterHeading chapter="Chapter V" title="Music & Visual Poetry" />
                       
                        <FadeInSection>
                            <div className="max-w-4xl mx-auto text-center mb-20 bg-white p-8 md:p-12 border border-[#d4af37]/30 shadow-md">
                                <p className="font-classic text-2xl md:text-3xl leading-relaxed text-slate-800">
                                    Original compositions scored using AI as an instrument—not as a replacement for musicianship, but as its most radical extension since the synthesiser.
                                </p>
                            </div>
                        </FadeInSection>
                       
                        <div className="flex flex-wrap justify-center gap-6 max-w-5xl mx-auto">
                            {tracks.map((mv, index) => (
                                <FadeInSection key={mv.id} delay={index * 100}>

        function App() {
            const [scrolled, setScrolled] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [playbackError, setPlaybackError] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const toggleAudio = () => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.pause();
                        setIsPlaying(false);
                        setPlaybackError(false);
                    } else {
                        audioRef.current.play()
                            .then(() => {
                                setIsPlaying(true);
                                setPlaybackError(false);
                            })
                            .catch(err => {
                                console.error("Audio playback failed:", err);
                                setPlaybackError(true);
                            });
                    }
                }
            };

            return (
                <div className="min-h-screen relative z-10 antialiased selection:bg-[#d4af37]/30 selection:text-slate-900">
                    <audio ref={audioRef} src="https://drive.google.com/uc?export=download&id=1FfCdvFIvCrMXkNDxisIi6eUl0liNdZSV" loop />
                   
                    <Navigation scrolled={scrolled} toggleAudio={toggleAudio} isPlaying={isPlaying} playbackError={playbackError} />
                    <Hero />
                    <ChapterArrival />
                    <ChapterManifesto />
                    <ChapterLatent />
                    <ChapterEpics />
                    <ChapterPoetry />
                    <ChapterSlate />
                    <ChapterArchitects />
                    <Footer />
                </div>
            );
        }
       
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
